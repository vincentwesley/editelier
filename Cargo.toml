[workspace]
resolver = "3"
members = ["src-tauri", "crates/editelier-core", "crates/vendor/craft-time", "crates/editelier-media"]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Vin, Vin's Atelier (https://vwesley.dev)"]
repository = "https://github.com/vincentwesley/editelier"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.145"
craft-time = { path = "crates/vendor/craft-time" }

[profile.dev.package."*"]
opt-level = 2
