[package]
name = "editelier"
version = "0.1.0"
description = "Editelier: free Windows video and photo editor"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.2"
editelier-core = { path = "../crates/editelier-core" }
editelier-media = { path = "../crates/editelier-media" }
editelier-export = { path = "../crates/editelier-export" }
editelier-render = { path = "../crates/editelier-render" }
wgpu = { version = "30.0.2", default-features = false, features = ["dx12", "wgsl"] }
raw-window-handle = "0.6.2"
pollster = "1.0.3"
# Same major as tauri 2.12 uses, so HWND types match and no second copy is built.
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
# Tauri CLI enables this for `tauri build`; also used for the self-contained --measure run.
custom-protocol = ["tauri/custom-protocol"]
# Debug-only agent control channel (D7): `cargo build --features agent`, enabled by EDITELIER_AGENT=1.
agent = [
  "windows/Win32_Security",
  "windows/Win32_Security_Authorization",
  "windows/Win32_Security_Cryptography",
  "windows/Win32_Storage_FileSystem",
  "windows/Win32_Storage_Xps",
  "windows/Win32_System_IO",
  "windows/Win32_System_Pipes",
]
