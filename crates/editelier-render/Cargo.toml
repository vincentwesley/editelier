[package]
name = "editelier-render"
version = "0.1.0"
description = "wgpu renderer: Y'CbCr import, scene-linear grade stage, DRT, compositor, titles, outputs"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
editelier-core = { path = "../editelier-core" }
wgpu = { version = "30.0.2", default-features = false, features = ["dx12", "wgsl"] }
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
pollster = "1.0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security",
] }
windows-core = "0.100.0"

[dev-dependencies]
png = "0.18.1"
editelier-export = { path = "../editelier-export" }
